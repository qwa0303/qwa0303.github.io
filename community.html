<!DOCTYPE html>
<html>
<head>
    <title>技术社区 | GJY的博客</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/community.css">
    <!-- Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="is-preload">
    <!-- 导航栏 -->
    <nav id="nav">
        <ul class="container">
            <li><a href="index.html">个人主页</a></li>
            <li><a href="community.html">技术社区</a></li>
            <li><a href="index.html#portfolio">我的项目</a></li>
            <li><a href="index.html#contact">联系</a></li>
        </ul>
        <!-- 导航栏搜索 -->
        <div class="nav-search">
            <form id="navSearchForm">
                <input type="text" placeholder="搜索社区..." class="nav-search-input">
                <button type="submit" class="nav-search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </form>
        </div>
    </nav>

    <!-- 社区头部 -->
    <article id="top" class="wrapper style1">
        <div class="container">
            <header>
                <h1>👥 技术社区</h1>
                <p>欢迎来到我们的学习交流社区！这里可以分享文章、交流技术、互相学习</p>
            </header>
            
            <!-- 社区功能按钮 -->
            <div class="community-header-actions">
                <button id="createPostBtn" class="button primary">
                    <i class="fas fa-plus"></i> 发布新帖
                </button>
                
                <div class="header-search">
                    <input type="text" id="headerSearchInput" placeholder="搜索帖子...">
                    <button onclick="CommunitySystem.handleSearch(document.getElementById('headerSearchInput').value)" 
                            class="button">
                        <i class="fas fa-search"></i> 搜索
                    </button>
                </div>
            </div>
        </div>
    </article>

    <!-- 社区主内容 -->
    <article class="wrapper style2">
        <div class="container">
            <div class="row">
                <!-- 用户侧边栏 -->
                <div class="col-4 col-12-medium">
                    <div class="community-sidebar">
                        <div class="user-panel" id="userPanel">
                            <!-- 用户信息或登录表单会动态显示 -->
                        </div>
                        
                        <div class="community-stats">
                            <h3>📊 社区数据</h3>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <strong id="totalUsers">0</strong>
                                    <span>注册用户</span>
                                </div>
                                <div class="stat-item">
                                    <strong id="totalPosts">0</strong>
                                    <span>社区文章</span>
                                </div>
                                <div class="stat-item">
                                    <strong id="totalComments">0</strong>
                                    <span>互动评论</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="online-users">
                            <h3>👥 在线用户</h3>
                            <div id="onlineUsersList">
                                <!-- 在线用户列表 -->
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 社区内容区 -->
                <div class="col-8 col-12-medium">
                    <div class="community-main">
                        <!-- 发布新帖区域 -->
                        <div class="new-post-card">
                            <textarea placeholder="点击这里发布新帖子..." 
                                      onclick="CommunitySystem.showCreatePostModal()"
                                      readonly
                                      style="cursor: pointer;"></textarea>
                            <div class="post-actions">
                                <button onclick="CommunitySystem.showCreatePostModal()" 
                                        class="button primary">
                                    <i class="fas fa-edit"></i> 发布新帖
                                </button>
                            </div>
                        </div>
                        
                        <!-- 帖子列表 -->
                        <div class="posts-container" id="postsContainer">
                            <!-- 社区帖子会动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </article>

    <!-- 模态框容器 -->
    <div id="authModal" class="modal"></div>
    <div id="postModal" class="modal"></div>

    <!-- 脚本引入 -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/community.js"></script>
    <script src="assets/js/user-system.js"></script>
</body>
</html>
